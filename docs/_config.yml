# GitHub Pages — docs/ as site root
# Custom domain hashseal.ai is live: site is at domain root (baseurl empty).
# Project-pages preview without custom domain would need baseurl: /hashseal again.

title: HashSeal
description: >-
  Seal and verify AI instruction files and build trees —
  what was sealed is what you still have.
url: https://hashseal.ai
baseurl: ""
github_url: https://github.com/monkeyking-hq/hashseal

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

# No remote theme — custom layout + assets/css/site.css only
plugins: []
# On GitHub Pages, relative links work via built-in support; keep paths repo-relative in content.

exclude:
  - BUILD-PROGRESS.md
  - BUILD-STANDING-ORDERS.md
  - MVP-BACKLOG.md
  - MVP-OVERNIGHT-REPORT.md
  - MEMORY.md
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default
