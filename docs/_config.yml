# GitHub Pages — docs/ as site root
# Until hashseal.ai DNS is verified, site is at /hashseal on github.io.
# After custom domain is live: url: https://hashseal.ai  and  baseurl: ""

title: HashSeal
description: >-
  Seal and verify AI instruction files and build trees —
  what was sealed is what you still have.
url: https://monkeyking-hq.github.io
baseurl: /hashseal
github_url: https://github.com/monkeyking-hq/hashseal

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

# No remote theme — custom layout + assets/css/site.css only
plugins: []
# On GitHub Pages, relative links work via built-in support; keep paths repo-relative in content.

exclude:
  - BUILD-PROGRESS.md
  - BUILD-STANDING-ORDERS.md
  - MVP-BACKLOG.md
  - MVP-OVERNIGHT-REPORT.md
  - MEMORY.md
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default
