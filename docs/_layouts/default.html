<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="icon" href="{{ '/assets/logo/mark.svg' | relative_url }}" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="{{ '/assets/logo/mark.svg' | relative_url }}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:image" content="{{ '/assets/logo/logo-stacked.svg' | absolute_url }}" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#0b0e14" />
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
</head>
<body>
  {% include header.html %}
  <main id="main" class="site-main{% unless page.home %} prose{% endunless %}">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
