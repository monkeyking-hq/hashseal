<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HashSeal">
  <title>HashSeal</title>
  <!-- Outer golden circlet with 12-o'clock registration notch -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#f5a524" stroke-width="3.5"/>
  <rect x="29.5" y="2" width="5" height="5.5" fill="#0b0e14"/>
  <!-- Inner seal rings (cool blue) -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#5b9fd4" stroke-width="2.25"/>
  <circle cx="32" cy="32" r="13.5" fill="none" stroke="#5b9fd4" stroke-width="1.75"/>
  <!-- Core -->
  <circle cx="32" cy="32" r="6.5" fill="#5b9fd4"/>
</svg>
