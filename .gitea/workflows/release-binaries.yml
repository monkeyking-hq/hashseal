# Release binary packaging + SHA256SUMS for the stonemonkey Gitea runner.
# Linux amd64 only — no windows/macos runner is registered.
#
# Copyright (c) 2026 MonkeyKing.dev

name: release-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release binaries
        run: |
          cargo build -p hashseal --release --target x86_64-unknown-linux-gnu
          cargo build -p hashseal-check --release --target x86_64-unknown-linux-gnu

      - name: Smoke test binaries
        run: |
          ./target/x86_64-unknown-linux-gnu/release/hashseal --version
          ./target/x86_64-unknown-linux-gnu/release/hashseal-check --version

      - name: Package archive & SHA256SUMS
        run: |
          STAGE=dist/hashseal-x86_64-unknown-linux-gnu
          mkdir -p "$STAGE"
          cp target/x86_64-unknown-linux-gnu/release/hashseal "$STAGE/"
          cp target/x86_64-unknown-linux-gnu/release/hashseal-check "$STAGE/"
          cp LICENSE "$STAGE/" 2>/dev/null || true
          echo "HashSeal release binaries for x86_64-unknown-linux-gnu" > "$STAGE/README.txt"
          tar -C "$STAGE" -czf dist/hashseal-x86_64-unknown-linux-gnu.tar.gz .
          (cd dist && sha256sum hashseal-x86_64-unknown-linux-gnu.tar.gz > SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashseal-x86_64-unknown-linux-gnu
          path: dist/

      - name: Publish Gitea release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${GITEA_TOKEN}"
          RESP="$(mktemp)"
          trap 'rm -f "$RESP"' EXIT

          STATUS=$(curl -sS -o "$RESP" -w '%{http_code}' -H "$AUTH" "${API}/releases/tags/${TAG}")
          if [ "$STATUS" = "404" ]; then
            curl -fsSL -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"HashSeal ${TAG}\",\"body\":\"Automated release binaries and SHA256SUMS for ${TAG}.\"}" \
              "${API}/releases" > "$RESP"
          elif [ "$STATUS" != "200" ]; then
            echo "Gitea release lookup failed (HTTP $STATUS)" >&2
            cat "$RESP" >&2
            exit 1
          fi

          REL_ID=$(python3 -c 'import sys, json; print(json.load(sys.stdin)["id"])' < "$RESP")

          # Remove any pre-existing asset with the same name before uploading.
          ASSETS_JSON="$(curl -fsSL -H "$AUTH" "${API}/releases/${REL_ID}/assets")"
          for ASSET_ID in $(printf '%s' "$ASSETS_JSON" | python3 -c 'import sys, json; names={"hashseal-x86_64-unknown-linux-gnu.tar.gz","SHA256SUMS"}; print("\n".join(str(a["id"]) for a in json.load(sys.stdin) if a.get("name") in names))'); do
            curl -fsSL -X DELETE -H "$AUTH" "${API}/releases/${REL_ID}/assets/${ASSET_ID}"
          done

          for FILE in hashseal-x86_64-unknown-linux-gnu.tar.gz SHA256SUMS; do
            curl -fsSL -X POST -H "$AUTH" \
              -F "attachment=@dist/${FILE}" \
              "${API}/releases/${REL_ID}/assets?name=${FILE}" >/dev/null
          done
