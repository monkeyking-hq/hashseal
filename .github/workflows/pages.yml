name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build VHS demos & Jekyll site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Setup musl cross toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: x86_64-unknown-linux-musl

      - name: Build static Linux binaries
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p hashseal -p hashseal-check

      - name: Verify executable CLI examples
        run: |
          HASHSEAL="$(pwd)/target/x86_64-unknown-linux-musl/release/hashseal" \
          HASHSEAL_CHECK="$(pwd)/target/x86_64-unknown-linux-musl/release/hashseal-check" \
          ./examples/cli/run-all.sh

      - name: Record terminal GIFs, WebMs, and screenshots with VHS
        run: |
          set -euo pipefail
          docker build -q -t hashseal-vhs -f docs/tapes/Dockerfile docs/tapes
          mkdir -p docs/assets/demos
          for tape in docs/tapes/*.tape; do
            echo "=== Recording $tape ==="
            docker run --rm -v "$(pwd):/vhs" -w /vhs hashseal-vhs "$tape"
          done
          ls -lh docs/assets/demos/
          for name in overview init-and-lockfile tamper-and-unicode ssh-signing check-and-json; do
            for ext in gif webm png; do
              test -s "docs/assets/demos/${name}.${ext}"
            done
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
