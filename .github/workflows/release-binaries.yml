# Multi-target release binary skeleton (build only — no secrets required).
# Attach artifacts to GitHub Releases in a later step if desired.
#
# Copyright (c) 2026 MonkeyKing.dev

name: release-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        run: |
          cargo build -p hashseal --release --target ${{ matrix.target }}
          cargo build -p hashseal-check --release --target ${{ matrix.target }}

      - name: Stage artifacts
        shell: bash
        run: |
          STAGE=dist/hashseal-${{ matrix.target }}
          mkdir -p "$STAGE"
          EXT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/hashseal${EXT}" "$STAGE/"
          cp "target/${{ matrix.target }}/release/hashseal-check${EXT}" "$STAGE/"
          cp LICENSE "$STAGE/" 2>/dev/null || true
          echo "HashSeal release binaries for ${{ matrix.target }}" > "$STAGE/README.txt"
          echo "Put hashseal on PATH or set HASHSEAL_BIN." >> "$STAGE/README.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashseal-${{ matrix.target }}
          path: dist/hashseal-${{ matrix.target }}/
