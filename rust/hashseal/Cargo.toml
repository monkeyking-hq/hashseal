[package]
name = "hashseal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "HashSeal CLI — seal and verify agent instructions and build trees"
readme = "README.md"

[[bin]]
name = "hashseal"
path = "src/main.rs"

[dependencies]
hashseal-core = { workspace = true, default-features = true }
# clap is the heaviest CLI dep — acceptable for full `hashseal`, not for check
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
serde_json = { workspace = true }
