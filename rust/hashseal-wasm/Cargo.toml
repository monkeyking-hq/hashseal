[package]
name = "hashseal-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "HashSeal WASM verify surface"
readme = "README.md"
keywords = ["integrity", "blake3", "ai-agents", "security", "wasm"]
categories = ["wasm", "cryptography"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM: digest check only — same minimal core as hashseal-check
hashseal-core = { workspace = true, features = ["check"] }
wasm-bindgen = "0.2"
